<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <!-- Filter for slight organic hand-inked edge softening -->
    <filter id="ink-bleed" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g filter="url(#ink-bleed)">
    <!-- Steam from tea mug -->
    <path d="M 230 400 C 220 370, 235 345, 225 320 C 218 300, 222 280, 232 265" fill="none" stroke="#222222" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <path d="M 260 415 C 255 385, 275 360, 265 330 C 258 310, 264 290, 272 275" fill="none" stroke="#222222" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

    <!-- Ceramic Tea Mug next to cat -->
    <!-- Mug Body -->
    <path d="M 205 450 C 205 440, 290 435, 295 450 L 285 535 C 283 555, 215 558, 212 535 Z" fill="#FFFFFF" stroke="#1F1F1F" stroke-width="9" stroke-linejoin="round"/>
    <!-- Mug Rim & Liquid (Tea) -->
    <ellipse cx="250" cy="448" rx="42" ry="12" fill="#C8674A" stroke="#1F1F1F" stroke-width="7"/>
    <!-- Mug Handle -->
    <path d="M 208 465 C 175 465, 175 515, 210 520" fill="none" stroke="#1F1F1F" stroke-width="8" stroke-linecap="round"/>
    <!-- Cute small doodle on mug (fish or leaf) -->
    <path d="M 242 490 Q 252 482 262 490 Q 252 498 242 490 Z" fill="#C8674A" stroke="#1F1F1F" stroke-width="2"/>

    <!-- The Black Cat Body - Rich solid inky black cat with elegant silhouette -->
    <!-- Tail: Sweeps out and curls high with graceful loop -->
    <path d="M 740 450 C 785 460, 840 475, 875 450 C 915 420, 930 350, 905 295 C 880 240, 820 225, 785 260 C 765 280, 770 315, 795 320 C 825 325, 845 295, 850 280 C 865 315, 855 385, 815 405 C 775 425, 725 410, 690 415 Z" fill="#181818" stroke="#181818" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Main Cat Silhouette: Haunches, back, paws, neck, head, ears -->
    <path d="
      M 320 260 
      C 305 200, 310 140, 335 110 
      C 345 98, 360 105, 375 135 
      C 400 155, 435 155, 465 135 
      C 480 105, 495 98, 505 110 
      C 525 135, 530 190, 520 245
      C 555 270, 640 295, 720 320
      C 775 340, 815 380, 825 435
      C 835 490, 805 540, 755 565
      C 715 580, 660 575, 620 560
      C 585 545, 560 525, 545 525
      C 515 525, 485 545, 450 555
      C 410 565, 370 565, 330 555
      C 290 545, 270 525, 260 500
      C 255 480, 270 460, 290 455
      C 315 450, 340 460, 355 480
      C 370 500, 395 505, 420 495
      C 445 485, 460 455, 465 425
      C 470 380, 450 340, 425 320
      C 375 315, 340 295, 320 260 Z
    " fill="#181818" stroke="#181818" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Front Paw resting gently beside / towards the warm tea mug -->
    <path d="M 290 455 C 275 455, 260 470, 255 490 C 250 515, 270 535, 295 535 C 315 535, 330 520, 340 500 Z" fill="#181818"/>
    <!-- Subtle paw toe division lines -->
    <path d="M 270 500 C 270 515, 275 525, 280 530" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
    <path d="M 288 505 C 290 520, 295 530, 300 532" stroke="#333333" stroke-width="4" stroke-linecap="round"/>

    <!-- Inner ear soft warm pink/charcoal hint -->
    <path d="M 345 125 C 352 145, 362 165, 375 168 C 368 152, 360 135, 352 125 Z" fill="#383838"/>
    <path d="M 495 125 C 488 145, 478 165, 465 168 C 472 152, 480 135, 488 125 Z" fill="#383838"/>

    <!-- Expressive, striking almond cat eyes with warm golden amber glow -->
    <!-- Left Eye -->
    <ellipse cx="375" cy="205" rx="20" ry="24" transform="rotate(-8 375 205)" fill="#F4B236"/>
    <!-- Left Pupil: vertical slit with soft tapered ends -->
    <path d="M 374 185 C 379 195, 379 215, 374 225 C 369 215, 369 195, 374 185 Z" fill="#121212"/>
    <!-- Left Eye light highlight catchlight -->
    <circle cx="369" cy="196" r="5" fill="#FFFFFF"/>
    <circle cx="372" cy="204" r="2.5" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <ellipse cx="465" cy="205" rx="20" ry="24" transform="rotate(8 465 205)" fill="#F4B236"/>
    <!-- Right Pupil -->
    <path d="M 466 185 C 471 195, 471 215, 466 225 C 461 215, 461 195, 466 185 Z" fill="#121212"/>
    <!-- Right Eye catchlight -->
    <circle cx="460" cy="196" r="5" fill="#FFFFFF"/>
    <circle cx="463" cy="204" r="2.5" fill="#FFFFFF"/>

    <!-- Sweet nose tip (soft terracotta pink/mauve) -->
    <polygon points="414,235 426,235 420,244" fill="#C8674A"/>
    <!-- Mouth curve -->
    <path d="M 420 244 L 420 252 M 420 252 Q 412 258 404 254 M 420 252 Q 428 258 436 254" fill="none" stroke="#444444" stroke-width="3" stroke-linecap="round"/>

    <!-- Fine white / light ink whiskers spreading gracefully -->
    <!-- Left Whiskers -->
    <path d="M 390 238 C 340 232, 290 240, 240 260" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 388 246 C 335 248, 285 262, 235 288" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 392 254 C 342 265, 295 288, 250 318" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

    <!-- Right Whiskers -->
    <path d="M 450 238 C 500 232, 550 240, 600 260" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 452 246 C 505 248, 555 262, 605 288" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 448 254 C 498 265, 545 288, 590 318" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

    <!-- Eyebrow whisker hairs -->
    <path d="M 365 175 C 345 150, 320 135, 295 125" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 475 175 C 495 150, 520 135, 545 125" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>

  </g>
</svg>